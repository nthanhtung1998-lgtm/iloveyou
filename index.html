<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Don't Click 😈</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#111;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
    transition:1s;
}

#message{
    text-align:center;
    font-size:50px;
    font-weight:bold;
    z-index:2;
    transition:0.5s;
}

.small{
    font-size:28px;
}

.big{
    font-size:75px;
    color:#ff4d88;
    text-shadow:0 0 10px #ff4d88,
                 0 0 25px #ff4d88,
                 0 0 50px #ff4d88;
    animation:pulse 1.2s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.08);
    }
}

.heart{
    position:absolute;
    color:#ff3366;
    font-size:24px;
    animation:float linear forwards;
    user-select:none;
}

@keyframes float{
    from{
        transform:translateY(100vh) scale(0.5);
        opacity:1;
    }
    to{
        transform:translateY(-120vh) scale(1.5);
        opacity:0;
    }
}

#count{
    color:#ff3333;
    font-size:100px;
}

</style>

</head>

<body>

<div id="message">
    <div class="small">Loading Secret...</div>
    <div id="count">5</div>
</div>

<script>

let count=5;
let counter=document.getElementById("count");
let message=document.getElementById("message");

let timer=setInterval(()=>{

count--;

if(count>=0){
counter.innerHTML=count;
}

if(count==-1){

clearInterval(timer);

message.innerHTML="⚠️<br>Virus Detected...";

setTimeout(()=>{

message.innerHTML="😂<br>Just Kidding!";

setTimeout(()=>{

document.body.style.background="#ffdde7";

message.className="big";
message.innerHTML="❤️<br>I LOVE YOU<br>❤️";

createHearts();

},1800);

},1800);

}

},1000);


function createHearts(){

setInterval(()=>{

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(20+Math.random()*35)+"px";

heart.style.animationDuration=(3+Math.random()*3)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},6000);

},150);

}

</script>

</body>
</html>
